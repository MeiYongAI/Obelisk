<script>
function show_properties(which) {
	e("skill_select_" + which).style.display = "";
}

function set_property(elem, which, selection) {

	e("skill_display_" + which).innerHTML = elem.innerHTML;
	e("skill_select_" + which).style.display = "none";
}
