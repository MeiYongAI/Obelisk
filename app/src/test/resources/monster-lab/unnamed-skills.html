			<th><div class="fc4 fac fcb"><div>Skill name</div></div></th>
			<th><div class="fc4 fac fcb"><div>Skill type</div></div></th>
			<th><div class="fc4 fac fcb"><div>Damage</div></div></th>

			<th><div class="fc4 fac fcb"><div>Cost</div></div></th>
		</tr>
		<tr>
			<td><input name="skill_name_0" value="" placeholder="Judgement Strike" type="text" size="20" maxlength="30"></td>
			<td>
				<div class="msp"><div id="skill_select_type_0" style="width:125px; left:0px; display:none"><div onclick="set_property(this, 'type_0', 'p')"><div class="fc4 fac fca"><div>Physical</div></div></div></div>
					<input id="skill_type_0" name="skill_type_0" type="hidden" value="p">

		</tr>
	</tbody></table>

	<img src="/fixture/saveskills.png" onclick="e('skillform').submit()">
</form>

<script type="text/javascript">
function show_properties(which) {
	e("skill_select_" + which).style.display = "";
}

function set_property(elem, which, selection) {
	e("skill_" + which).value = selection;
	e("skill_display_" + which).innerHTML = elem.innerHTML;
	e("skill_select_" + which).style.display = "none";
}
</script></div></div></div>
