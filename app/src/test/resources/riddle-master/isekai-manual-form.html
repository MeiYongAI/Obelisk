<div><input disabled="disabled" id="riddlesubmit" name="riddlesubmit" type="submit" value="提交答案"/></div>
<div id="riddlecounter"><div style="position:relative; display:inline; height:12px; width:19px"><div style="float:right; height:12px; width:10px; background:transparent url(/isekai/y/font/12b.png) 0px -0px"></div><div style="float:right; height:12px; width:11px; background:transparent url(/isekai/y/font/12b.png) 0px -24px"></div></div></div>
</div>
</form>
<p>请在时间限制结束之前选择你在上图认出的所有小马名称并点击“提交答案”</p>
</div>
</div><script type="text/javascript">
var end_time = 1795264287;
var time_skew = 1795264257 - Math.floor(Date.now() / 1000);
var timer = setInterval(function() {
	var time = Math.max(0, Math.ceil(end_time - Date.now() / 1000 - time_skew));

	if(time < 1) {
		clearInterval(timer);
		e("riddleform").submit();
	}

	e("riddlecounter").innerHTML = common.get_dynamic_digit_string(time);
}, 100);

function check_submit_button() {
	var selected_count = 0;

	for(i = 0; i < document.riddleform.elements.length; i++) {
		if(document.riddleform.elements[i].name == "riddleanswer[]") {
			if(document.riddleform.elements[i].checked) {
				++selected_count;
			}
		}
	}

	e("riddlesubmit").disabled = selected_count > 0 && selected_count < 4 ? "" : "disabled";
}
</script></body></html>
